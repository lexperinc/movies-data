<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Film Arşivi</title>
<meta name="description" content="Film ve dizi koleksiyonu">
<meta property="og:title" content="Film Arşivi">
<meta property="og:description" content="Film ve dizi koleksiyonu">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b10;--card:#14141d;--card2:#1d1d2a;--line:#2a2a3b;--tx:#e8ebf2;--tx2:#98a2b3;--tx3:#69718a;
 --ac:#ef4444;--ac2:#f59e0b;--sb:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);
 font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:50;background:rgba(11,11,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:11px 0}
.logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.sp{flex:1}
.srch{position:relative;flex:1;max-width:420px}
.srch input{width:100%;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--line);
 border-radius:10px;color:var(--tx);font-size:13.5px;outline:none}
.srch input:focus{border-color:var(--ac)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--tx3);fill:none;stroke-width:2}
.tabs{display:flex;gap:6px;padding:0 0 10px}
.tab{padding:7px 15px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--tx2);transition:.15s}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:600}
main{padding:14px 0 calc(40px + var(--sb));min-height:70vh}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.18s;position:relative}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}
.card .ps{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--card2)}
.card .in{padding:8px 9px}
.card h3{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:11px;color:var(--tx2);margin-top:3px;display:flex;align-items:center;gap:5px}
.badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
 font-size:10px;padding:3px 7px;border-radius:20px;font-weight:700;display:flex;align-items:center;gap:3px}
.badge.tv{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.row-list .card{display:flex;gap:11px;align-items:center;padding:9px}
.row-list .card .ps{width:48px;aspect-ratio:2/3;border-radius:7px;flex-shrink:0}
.row-list .card .in{padding:0;flex:1;min-width:0}
.empty{text-align:center;padding:60px 20px;color:var(--tx2)}
.empty b{display:block;font-size:16px;color:var(--tx);margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);
 background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px;aspect-ratio:2/3}
@keyframes sh{to{background-position:-200% 0}}
/* modal */
.mv{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:none;
 align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.mv.on{display:flex}
.mb{width:100%;max-width:860px;max-height:94vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);
 border-radius:18px 18px 0 0;animation:up .3s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:700px){.mv{align-items:center;padding:20px}.mb{border-radius:16px}}
.mh{position:relative}
.mh .bg{width:100%;height:190px;object-fit:cover;opacity:.32}
.mh .grad{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 6%,transparent)}
.mh .cls{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);
 backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:19px;z-index:2}
.mi{display:flex;gap:14px;padding:0 16px;margin-top:-72px;position:relative}
.mi img{width:100px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;border:2px solid var(--line);flex-shrink:0;background:var(--card2)}
.mi .t{padding-top:76px;min-width:0}
.mi h2{font-size:19px;line-height:1.25;margin-bottom:5px}
.mi .meta{font-size:12px;color:var(--tx2);display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.star{color:#fbbf24}
.mc{padding:16px}
.ov{font-size:13px;color:var(--tx2);line-height:1.6;margin-bottom:16px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pb{padding:11px 18px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;
 font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.pb:active{transform:scale(.97)}
.pb.alt{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.sl{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.sl::-webkit-scrollbar{display:none}
.sl button{padding:7px 14px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
 font-size:12.5px;white-space:nowrap;flex-shrink:0}
.sl button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:600}
.ep{display:flex;align-items:center;gap:11px;padding:10px;background:var(--card);border:1px solid var(--line);
 border-radius:10px;margin-bottom:7px;transition:.15s;width:100%;text-align:left}
.ep:hover{border-color:var(--ac)}
.ep .n{width:32px;height:32px;border-radius:8px;background:var(--card2);display:flex;align-items:center;
 justify-content:center;font-size:12px;font-weight:700;color:var(--tx2);flex-shrink:0}
.ep.has .n{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.ep .x{flex:1;min-width:0}
.ep h4{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep p{font-size:11px;color:var(--tx3)}
.ep[disabled]{opacity:.45;cursor:not-allowed}
/* player */
.pl{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}
.pl.on{display:flex}
.pl .bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,.85);color:#fff}
.pl .bar b{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl video,.pl iframe{flex:1;width:100%;height:100%;border:0;background:#000}
footer{border-top:1px solid var(--line);padding:18px 0 calc(24px + var(--sb));text-align:center;color:var(--tx3);font-size:11.5px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo">Film Arşivi</div>
      <div class="sp"></div>
      <div class="srch">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
        <input id="q" placeholder="Ara…" autocomplete="off">
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-f="all">Tümü</button>
      <button class="tab" data-f="movie">Filmler</button>
      <button class="tab" data-f="tv">Diziler</button>
    </div>
  </div>
</header>
<main class="wrap"><div id="out" class="grid"></div></main>
<footer>Film ve dizi koleksiyonu · <span id="cnt"></span></footer>

<div class="mv" id="mv"><div class="mb" id="mb"></div></div>
<div class="pl" id="pl">
  <div class="bar"><button id="plX" style="font-size:20px">&times;</button><b id="plT"></b></div>
  <div id="plC" style="flex:1;display:flex"></div>
</div>

<script>
const IMG='https://image.tmdb.org/t/p/';
const NP="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='92' height='138'><rect width='92' height='138' fill='#1d1d2a'/><text x='50%' y='53%' font-size='28' text-anchor='middle' fill='#4c5468'>?</text></svg>");
const GRID=true;
let DATA=[],filt='all',q='';
const el=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ps=(p,s)=>p?IMG+(s||'w342')+p:NP;
const rate=v=>{const n=Number(v);return n>0?n.toFixed(1):'–'};
const sNo=k=>{const m=String(k).match(/\d+/);return m?+m[0]:0};

async function boot(){
  el('#out').innerHTML=Array.from({length:12},()=>'<div class="sk"></div>').join('');
  const g=async f=>{try{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}catch{return null}};
  const [m,s]=await Promise.all([g('movies.json'),g('series.json')]);
  const films=((m&&m.filmler)||[]).map(f=>({...f,_k:'movie',_t:f.title||'Film',_y:f.year||''}));
  const tv=((s&&s.diziler)||[]).map(d=>({...d,_k:'tv',_t:d.name||'Dizi',_y:d.year||''}));
  DATA=[...films,...tv].sort((a,b)=>String(b.updated_at||b.added_at||'').localeCompare(String(a.updated_at||a.added_at||'')));
  el('#cnt').textContent=films.length+' film · '+tv.length+' dizi';
  render();
}

function epsOf(d){return Object.values(d.seasons||{}).reduce((a,x)=>a.concat(Array.isArray(x)?x:[]),[])}

function render(){
  const o=el('#out');
  o.className=GRID?'grid':'grid row-list';
  let L=DATA.filter(x=>filt==='all'||x._k===filt);
  if(q)L=L.filter(x=>x._t.toLowerCase().includes(q));
  if(!L.length){o.className='';o.innerHTML='<div class="empty"><b>Sonuç yok</b><p>Farklı bir arama dene.</p></div>';return}
  o.innerHTML=L.map((x,i)=>{
    const idx=DATA.indexOf(x);
    const sub=x._k==='tv'?(Object.keys(x.seasons||{}).length+' sezon · '+epsOf(x).length+' bölüm'):(x._y||'');
    return '<div class="card" data-i="'+idx+'">'+
      '<img class="ps" loading="lazy" src="'+esc(ps(x.poster_path,GRID?'w342':'w154'))+'" alt="'+esc(x._t)+'" onerror="this.src=NP">'+
      '<span class="badge'+(x._k==='tv'?' tv':'')+'">'+(x._k==='tv'?'DİZİ':'FİLM')+'</span>'+
      '<div class="in"><h3>'+esc(x._t)+'</h3><p><span class="star">★</span>'+rate(x.vote_average)+
      (sub?' · '+esc(sub):'')+'</p></div></div>';
  }).join('');
}

function open(i){
  const x=DATA[i];if(!x)return;
  const back=ps(x.backdrop_path||x.poster_path,'w780');
  let h='<div class="mh"><img class="bg" src="'+esc(back)+'" alt="" onerror="this.style.display=\'none\'">'+
    '<div class="grad"></div><button class="cls" data-x>&times;</button></div>'+
    '<div class="mi"><img src="'+esc(ps(x.poster_path,'w342'))+'" alt="" onerror="this.src=NP">'+
    '<div class="t"><h2>'+esc(x._t)+'</h2><div class="meta">'+
    (x._y?'<span>'+esc(x._y)+'</span>':'')+'<span class="star">★ '+rate(x.vote_average)+'</span></div></div></div><div class="mc">';
  if(x.overview)h+='<p class="ov">'+esc(x.overview)+'</p>';
  if(x._k==='movie'){
    const b=[];
    if(x.video)b.push(['▶ Oynat',x.video,'']);
    if(x.video_720)b.push(['720p',x.video_720,'alt']);
    if(x.video_1080)b.push(['1080p',x.video_1080,'alt']);
    h+=b.length?'<div class="pbtns">'+b.map(([t,u,c])=>'<button class="pb '+c+'" data-p="'+esc(u)+'" data-t="'+esc(x._t)+'">'+t+'</button>').join('')+'</div>'
      :'<p class="ov">Bu içerik için henüz kaynak eklenmemiş.</p>';
  }else{
    const ks=Object.keys(x.seasons||{}).sort((a,b)=>sNo(a)-sNo(b));
    if(!ks.length)h+='<p class="ov">Henüz bölüm eklenmemiş.</p>';
    else{
      h+='<div class="sl">'+ks.map((k,j)=>'<button class="'+(j?'':'on')+'" data-s="'+esc(k)+'">Sezon '+sNo(k)+'</button>').join('')+'</div><div id="eps"></div>';
    }
  }
  h+='</div>';
  el('#mb').innerHTML=h;el('#mv').classList.add('on');
  document.body.style.overflow='hidden';
  const ks=Object.keys(x.seasons||{}).sort((a,b)=>sNo(a)-sNo(b));
  if(x._k==='tv'&&ks.length)eps(x,ks[0]);
  el('#mb').onclick=e=>{
    const c=e.target.closest('[data-x]');if(c)return close();
    const s=e.target.closest('[data-s]');
    if(s){el('#mb').querySelectorAll('.sl button').forEach(b=>b.classList.toggle('on',b===s));return eps(x,s.dataset.s)}
    const p=e.target.closest('[data-p]');
    if(p)play(p.dataset.p,p.dataset.t);
  };
}
function eps(x,k){
  const list=(x.seasons[k]||[]).slice().sort((a,b)=>a.episode-b.episode);
  el('#eps').innerHTML=list.map(e=>{
    const t=x._t+' · S'+String(sNo(k)).padStart(2,'0')+'E'+String(e.episode).padStart(2,'0');
    return '<button class="ep'+(e.video?' has':'')+'"'+(e.video?' data-p="'+esc(e.video)+'" data-t="'+esc(t)+'"':' disabled')+'>'+
      '<span class="n">'+String(e.episode).padStart(2,'0')+'</span>'+
      '<span class="x"><h4>'+esc(e.name||('Bölüm '+e.episode))+'</h4>'+
      '<p>'+(e.video?'İzlemek için dokun':'Kaynak yok')+'</p></span></button>';
  }).join('')||'<p class="ov">Bu sezonda bölüm yok.</p>';
}
function close(){el('#mv').classList.remove('on');el('#mb').innerHTML='';document.body.style.overflow=''}

function play(url,title){
  el('#plT').textContent=title||'';
  const direct=/\.(mp4|webm|ogg|m4v|mov)(\?|$)/i.test(url);
  el('#plC').innerHTML=direct
    ?'<video src="'+esc(url)+'" controls autoplay playsinline style="width:100%;height:100%"></video>'
    :'<iframe src="'+esc(url)+'" allowfullscreen allow="autoplay;encrypted-media;fullscreen" referrerpolicy="no-referrer"></iframe>';
  el('#pl').classList.add('on');
}
el('#plX').onclick=()=>{el('#pl').classList.remove('on');el('#plC').innerHTML=''};
el('#mv').onclick=e=>{if(e.target===el('#mv'))close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el('#pl').classList.contains('on')){el('#pl').classList.remove('on');el('#plC').innerHTML=''}else close()}});
el('#out').onclick=e=>{const c=e.target.closest('[data-i]');if(c)open(+c.dataset.i)};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===t));filt=t.dataset.f;render()});
let dt;el('#q').oninput=e=>{clearTimeout(dt);dt=setTimeout(()=>{q=e.target.value.trim().toLowerCase();render()},180)};
boot();
</script>
</body>
</html>
